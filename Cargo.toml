[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/curio-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Curio contributors"]
repository = "https://github.com/RatikGambhir/curio-browser"
homepage = "https://github.com/RatikGambhir/curio-browser"
publish = false

[workspace.dependencies]
# Internal crates
curio-core = { path = "crates/curio-core" }
curio-tabs = { path = "crates/curio-tabs" }
curio-spaces = { path = "crates/curio-spaces" }
curio-storage = { path = "crates/curio-storage" }
curio-settings = { path = "crates/curio-settings" }
curio-ai = { path = "crates/curio-ai" }
curio-browser = { path = "crates/curio-browser" }
curio-ui = { path = "crates/curio-ui" }

# UI: GPUI (via GPUI Kit) on the GPUI Fast backend, which composites native
# webviews underneath GPUI overlays on macOS and Linux.
gpui-kit = { version = "0.8.1", features = ["gpui-fast"] }
gpui-webview = { version = "0.8.1", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry", features = ["devtools"] }

# Shared
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
async-channel = "2"
dirs = "7"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
# GPUI builder chains and view constructors routinely trip these.
too_many_arguments = "allow"
type_complexity = "allow"
new_without_default = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
