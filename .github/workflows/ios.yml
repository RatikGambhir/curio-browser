name: iOS CI

on:
  # Branch pushes are covered by pull_request; main still runs so CodeQL keeps a baseline.
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

defaults:
  run:
    working-directory: ios

jobs:
  codeql:
    name: iOS / CodeQL
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build for CodeQL
        timeout-minutes: 15
        env:
          # Fire before the step timeout so the diagnostics make it into the log.
          WATCHDOG_SECONDS: 720
        run: |
          # When the traced build stalls, print what is running, sample the stuck
          # compiler/extractor processes, and tail CodeQL's logs, then stop the build.
          diagnose() {
            echo "::group::Watchdog: Swift, CodeQL and build processes"
            ps -axww -o pid,ppid,etime,%cpu,rss,state,command \
              | grep -Ei 'swift|codeql|extractor|xcodebuild|xcbbuild' \
              | grep -v grep | cut -c1-500
            echo "::endgroup::"
            for pid in $(pgrep -f 'swift-frontend|/swift/tools/' | head -n 4); do
              echo "::group::Watchdog: stack sample of pid $pid"
              ps -ww -o pid,etime,%cpu,state,command -p "$pid" | cut -c1-500
              sample "$pid" 3 -mayDie -file "$RUNNER_TEMP/sample-$pid.txt" >/dev/null 2>&1
              sed -n '1,120p' "$RUNNER_TEMP/sample-$pid.txt" 2>/dev/null
              echo "::endgroup::"
            done
            echo "::group::Watchdog: newest CodeQL log files"
            find "$RUNNER_TEMP/codeql_databases" -type f -path '*log*' -print0 2>/dev/null \
              | xargs -0 ls -t 2>/dev/null | head -n 4 | while read -r log; do
                echo "--- $log"
                tail -n 60 "$log"
              done
            echo "::endgroup::"
          }

          # CodeQL needs one architecture; generic simulator builds otherwise compile both.
          xcodebuild build -project Curio.xcodeproj -scheme Curio \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/Curio-CodeQL" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO COMPILER_INDEX_STORE_ENABLE=NO &
          build_pid=$!

          (
            # Actions runs bash with -e; a grep with no matches must not end the watchdog.
            set +e
            # The sleep is killed when the build finishes first; leave quietly then.
            sleep "$WATCHDOG_SECONDS" || exit 0
            echo "::error::CodeQL build still running after ${WATCHDOG_SECONDS}s; collecting diagnostics."
            diagnose
            pkill -TERM -P "$build_pid" || true
            kill -TERM "$build_pid" || true
          ) &
          watchdog_pid=$!

          status=0
          wait "$build_pid" || status=$?
          pkill -P "$watchdog_pid" 2>/dev/null || true
          kill "$watchdog_pid" 2>/dev/null || true
          exit "$status"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift

  test:
    name: iOS / test (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17 Pro, iPad Pro 13-inch (M5)]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare iOS 26.2 simulator
        id: simulator
        timeout-minutes: 10
        env:
          SIMULATOR_DEVICE: ${{ matrix.device }}
        run: |
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-26-2
          if ! xcrun simctl list runtimes --json | python3 -c 'import json, sys; sys.exit(not any(r["identifier"] == sys.argv[1] and r.get("isAvailable", False) for r in json.load(sys.stdin)["runtimes"]))' "$runtime"; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.2
          fi
          xcrun simctl list runtimes
          simulator_id=$(xcrun simctl create "Curio CI - $SIMULATOR_DEVICE" "$SIMULATOR_DEVICE" "$runtime")
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run unit, integration, snapshot, and UI tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild test -project Curio.xcodeproj -scheme Curio \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Curio.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/Curio.xcresult

  build:
    name: iOS / build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compile the unsigned device build
        run: |
          xcodebuild build -project Curio.xcodeproj -scheme Curio -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  lint:
    name: iOS / lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: brew install swiftlint
      - run: swiftlint lint --strict
