name: Curio
options:
  bundleIdPrefix: app.curio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Curio:
    type: application
    platform: iOS
    sources:
      - path: Curio
    info:
      path: Curio/App/Info.plist
      properties:
        CFBundleDisplayName: Curio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Websites you visit can ask to use the camera.
        NSMicrophoneUsageDescription: Websites you visit can ask to use the microphone.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location.
        NSPhotoLibraryAddUsageDescription: Curio saves images you choose to your photo library.
        NSLocalNetworkUsageDescription: Curio connects to AI servers and sites on your local network, such as Ollama.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.curio.browser
        PRODUCT_NAME: Curio
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  CurioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CurioTests
    dependencies:
      - target: Curio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.curio.browser.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Curio:
    build:
      targets:
        Curio: all
        CurioTests: [test]
    test:
      targets:
        - CurioTests
