[package]
name = "curio-app"
description = "The Curio web browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "Curio"

[[bin]]
name = "Curio"
path = "src/main.rs"

[dependencies]
curio-core.workspace = true
curio-spaces.workspace = true
curio-storage.workspace = true
curio-settings.workspace = true
curio-ai.workspace = true
curio-ui.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
async-channel.workspace = true
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.10" }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }

[package.metadata.bundle]
name = "Curio"
identifier = "app.curio.browser"

[lints]
workspace = true
